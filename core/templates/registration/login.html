{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Ferretería</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'warehouse/css/shell.css' %}">
  <link rel="stylesheet" href="{% static 'warehouse/css/forms.css' %}">
</head>
<body class="ft-body d-flex align-items-center" style="min-height:100vh">
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="text-center mb-4">
        <div class="ft-home-avatar mx-auto mb-3" style="width:72px;height:72px;font-size:1.75rem;border-radius:20px">
          <i class="bi bi-tools"></i>
        </div>
        <h1 class="h4 mb-1" style="letter-spacing:-0.02em">Ferretería</h1>
        <p class="text-muted small mb-0">Acceso al sistema de tienda</p>
      </div>
      <form method="post" action="{% url 'login' %}" class="ft-form card ft-form-card">
        {% csrf_token %}
        {% if form.non_field_errors %}
          <div class="alert alert-danger ft-form-alert m-3 mb-0">{{ form.non_field_errors }}</div>
        {% endif %}
        <div class="ft-form-body">
          <div class="ft-form-grid" style="grid-template-columns:1fr">
            <div class="ft-field">
              <label class="ft-label" for="id_username">Usuario</label>
              <div class="ft-input-wrap">
                <span class="ft-field-icon" aria-hidden="true"><i class="bi bi-person"></i></span>
                <input type="text" name="username" id="id_username" class="form-control ft-control" required autofocus>
              </div>
            </div>
            <div class="ft-field">
              <label class="ft-label" for="id_password">Contraseña</label>
              <div class="ft-input-wrap">
                <span class="ft-field-icon" aria-hidden="true"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" id="id_password" class="form-control ft-control" required>
              </div>
            </div>
          </div>
        </div>
        <input type="hidden" name="next" value="{{ next|default:'/' }}">
        <div class="ft-form-actions">
          <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i> Entrar</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="{% static 'warehouse/js/forms.js' %}" defer></script>
</body>
</html>
