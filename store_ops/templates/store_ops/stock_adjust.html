{% extends "store_ops/base.html" %}
{% block title %}Ajuste inventario{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Ajuste de inventario</h1>
<p class="text-muted">Use cantidad positiva para entrada y negativa para salida (merma, corrección).</p>
<form method="post" class="card p-4 shadow-sm">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-warning" type="submit">Aplicar ajuste</button>
</form>
{% endblock %}
