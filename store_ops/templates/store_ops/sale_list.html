{% extends "store_ops/base.html" %}
{% block title %}Ventas{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Ventas recientes</h1>
<a class="btn btn-success mb-3" href="{% url 'sale_create' %}">Nueva venta</a>
<table class="table table-sm bg-white shadow-sm">
  <thead><tr><th>#</th><th>Fecha</th><th>Pago</th><th>Total</th></tr></thead>
  <tbody>
  {% for s in sales %}
    <tr>
      <td>{{ s.id }}</td>
      <td>{{ s.created_at }}</td>
      <td>{{ s.get_payment_method_display }}</td>
      <td>{{ s.total }}</td>
    </tr>
  {% empty %}
    <tr><td colspan="4">Sin ventas.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
